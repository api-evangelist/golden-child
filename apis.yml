aid: golden-child
name: Golden Child
description: >-
  Golden Child is a direct-to-consumer pet wellness brand offering fresh,
  human-grade, vet-formulated dog food delivered on a subscription basis.
  Founded in 2025 by former Hims & Hers leaders Quentin Lacornerie and
  Jack Abraham, the company pairs science-backed "main" meals with
  taste-driven "drizzle" toppers, guided by a two-minute intake quiz that
  builds a personalized meal plan for each dog. It operates a Shopify
  Hydrogen storefront at mygoldenchild.com and has raised $37M from
  Redpoint Ventures, Atomic, and A*. Golden Child publishes no public
  developer API, documentation, or SDKs; this profile tracks it as a
  company in the API Evangelist network, surfaced from the Redpoint
  Ventures portfolio.
